<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jx Todo App</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f7f4;
      color: #1d1f24;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: start center;
      padding: 48px 16px;
    }

    .todo-app {
      width: min(100%, 520px);
    }

    h1 {
      margin: 0 0 18px;
      font-size: 32px;
      line-height: 1.1;
      font-weight: 700;
    }

    .todo-form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      margin-bottom: 12px;
    }

    input[type="text"] {
      min-width: 0;
      height: 42px;
      border: 1px solid #c9c9c3;
      border-radius: 6px;
      padding: 0 12px;
      font: inherit;
      background: #fff;
    }

    button {
      height: 42px;
      border: 1px solid #22252b;
      border-radius: 6px;
      padding: 0 14px;
      font: inherit;
      font-weight: 650;
      background: #22252b;
      color: #fff;
      cursor: pointer;
    }

    button:disabled {
      border-color: #b9bab7;
      background: #d7d8d4;
      color: #74766f;
      cursor: default;
    }

    button.secondary {
      width: 100%;
      margin-top: 12px;
      background: transparent;
      color: #22252b;
    }

    button.danger {
      border-color: #b74235;
      background: #b74235;
    }

    .todo-summary {
      margin: 0 0 10px;
      color: #575a61;
      font-size: 14px;
    }

    .todo-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .todo-item,
    .todo-empty {
      min-height: 44px;
      display: grid;
      align-items: center;
      border: 1px solid #deded8;
      border-radius: 6px;
      background: #fff;
    }

    .todo-item {
      grid-template-columns: 24px 1fr auto;
      gap: 10px;
      padding: 8px 8px 8px 12px;
    }

    .todo-item span {
      overflow-wrap: anywhere;
    }

    .todo-item.completed span {
      color: #777a82;
      text-decoration: line-through;
    }

    .todo-empty {
      padding: 0 12px;
      color: #777a82;
    }
  </style>
</head>
<body>
  <main id="app"></main>
  <script src="./index.bc.js" type="text/javascript"></script>
</body>
</html>
